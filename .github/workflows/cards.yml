name: Regenerate Stat Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The default GITHUB_TOKEN can only see this one repository, which would
      # silently shrink every total. Skip the run unless a PAT is configured.
      - name: Check for a token that can see private repos
        id: gate
        run: |
          if [ -n "${{ secrets.STATS_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "STATS_TOKEN secret is not set, leaving the committed cards untouched."
          fi

      - name: Generate cards
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python3 scripts/generate_cards.py

      - name: Commit if changed
        if: steps.gate.outputs.ready == 'true'
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "Refresh generated stat cards"
            git push
          else
            echo "No change in generated cards."
          fi
