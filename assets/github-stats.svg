<svg width="450" height="195" viewBox="0 0 450 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #4169E1; }
    .label { font: 400 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #a9b1d6; }
    .value { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #00CED1; }
    .small { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #a9b1d6; }
  </style>
  <defs>
    <pattern id="ovgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.05" fill="#2c3150"/>
      <animateTransform attributeName="patternTransform" type="translate"
        values="0,0;26,26" dur="20s" repeatCount="indefinite"/>
    </pattern>
    <radialGradient id="ovo0"><stop offset="0%" stop-color="#8A2BE2" stop-opacity="0.3"/><stop offset="100%" stop-color="#8A2BE2" stop-opacity="0"/></radialGradient><radialGradient id="ovo1"><stop offset="0%" stop-color="#00CED1" stop-opacity="0.24"/><stop offset="100%" stop-color="#00CED1" stop-opacity="0"/></radialGradient><radialGradient id="ovo2"><stop offset="0%" stop-color="#4169E1" stop-opacity="0.26"/><stop offset="100%" stop-color="#4169E1" stop-opacity="0"/></radialGradient>
    <clipPath id="ovclip"><rect x="0.5" y="0.5" rx="10" width="449" height="194"/></clipPath>
  </defs>
  <g clip-path="url(#ovclip)">
    <rect width="450" height="195" fill="#1a1b27"/>
    <circle cx="81" cy="58" r="189" fill="url(#ovo0)"><animate attributeName="cx" values="81;153;9;81" dur="17s" repeatCount="indefinite"/><animate attributeName="cy" values="58;20;98;58" dur="22s" repeatCount="indefinite"/></circle><circle cx="369" cy="129" r="171" fill="url(#ovo1)"><animate attributeName="cx" values="369;441;297;369" dur="23s" repeatCount="indefinite"/><animate attributeName="cy" values="129;90;168;129" dur="30s" repeatCount="indefinite"/></circle><circle cx="234" cy="166" r="180" fill="url(#ovo2)"><animate attributeName="cx" values="234;306;162;234" dur="29s" repeatCount="indefinite"/><animate attributeName="cy" values="166;127;205;166" dur="38s" repeatCount="indefinite"/></circle>
    <rect width="450" height="195" fill="url(#ovgrid)"/>
  </g>
  <rect x="0.5" y="0.5" rx="10" width="449" height="194" fill="none" stroke="#2f3352"/>
  <g opacity="1"><text x="25" y="35" class="title">GitHub Overview</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0417;0.2708;1" dur="2.4s" fill="freeze"/></g>
  <g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1458;0.3750;1" dur="2.4s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-14,0;-14,0;0,0;0,0" keyTimes="0;0.1458;0.3750;1" dur="2.4s" fill="freeze"/><text x="25" y="68" class="label">Total Repositories</text><text x="425" y="68" class="value" text-anchor="end">60</text></g>
  <g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2000;0.4292;1" dur="2.4s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-14,0;-14,0;0,0;0,0" keyTimes="0;0.2000;0.4292;1" dur="2.4s" fill="freeze"/><text x="25" y="94" class="label">Private Repositories</text><text x="425" y="94" class="value" text-anchor="end">58</text></g>
  <g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2542;0.4833;1" dur="2.4s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-14,0;-14,0;0,0;0,0" keyTimes="0;0.2542;0.4833;1" dur="2.4s" fill="freeze"/><text x="25" y="120" class="label">Dynamo Tasks Shipped</text><text x="425" y="120" class="value" text-anchor="end">150+</text></g>
  <g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3083;0.5375;1" dur="2.4s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-14,0;-14,0;0,0;0,0" keyTimes="0;0.3083;0.5375;1" dur="2.4s" fill="freeze"/><text x="25" y="146" class="label">Languages Used</text><text x="425" y="146" class="value" text-anchor="end">9</text></g>
  <g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3625;0.5917;1" dur="2.4s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-14,0;-14,0;0,0;0,0" keyTimes="0;0.3625;0.5917;1" dur="2.4s" fill="freeze"/><text x="25" y="172" class="label">Primary Language</text><text x="425" y="172" class="value" text-anchor="end">Python</text></g>
</svg>
