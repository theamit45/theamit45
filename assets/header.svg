<svg width="1000" height="200" viewBox="0 0 1000 200"
     xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <linearGradient id="hdrg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="50%" stop-color="#4169E1"/>
      <stop offset="100%" stop-color="#00CED1"/>
    </linearGradient>
    <pattern id="hdrdots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#ffffff" fill-opacity="0.16"/>
      <animateTransform attributeName="patternTransform" type="translate"
        values="0,0;24,24" dur="16s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="hdrclip"><rect width="1000" height="200"/></clipPath>
  </defs>
  <g clip-path="url(#hdrclip)">
    <rect width="1000" height="200" fill="url(#hdrg)"/>
    <rect width="1000" height="200" fill="url(#hdrdots)"/>
    <g opacity="0.18">
      <g>
        <path d="M0,124.0 q250.0,-16 500.0,0 t500.0,0 V200 H0 Z" fill="#ffffff"/>
        <path d="M0,124.0 q250.0,-16 500.0,0 t500.0,0 V200 H0 Z" fill="#ffffff" transform="translate(1000,0)"/>
        <animateTransform attributeName="transform" type="translate"
          from="0,0" to="-1000,0" dur="14s" repeatCount="indefinite"/>
      </g>
    </g><g opacity="0.3">
      <g>
        <path d="M0,156.0 q250.0,-11 500.0,0 t500.0,0 V200 H0 Z" fill="#ffffff"/>
        <path d="M0,156.0 q250.0,-11 500.0,0 t500.0,0 V200 H0 Z" fill="#ffffff" transform="translate(1000,0)"/>
        <animateTransform attributeName="transform" type="translate"
          from="0,0" to="-1000,0" dur="9.799999999999999s" repeatCount="indefinite"/>
      </g>
    </g>
    <g opacity="0.10">
    <rect x="-300.0" y="-200" width="140.0" height="600"
          fill="#ffffff" transform="rotate(18)">
      <animate attributeName="x" from="-400.0" to="1300.0"
               dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  </g>
  <text x="500.0" y="88.0" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Sans-Serif" font-size="46" font-weight="700" fill="#ffffff">Amit Kumar Maurya</text>
  <text x="500.0" y="132.0" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Sans-Serif" font-size="19" font-weight="400" fill="#ffffff" fill-opacity="0.88">AI Evaluation Specialist &amp; Benchmark Engineer</text>
</svg>
