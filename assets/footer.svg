  </g>
  </g>
  
  <text x="500.0" y="72.80000000000001" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Sans-Serif" font-size="21" font-weight="400" fill="#ffffff" fill-opacity="0.88">If it isn&apos;t tested, it doesn&apos;t work.</text>
