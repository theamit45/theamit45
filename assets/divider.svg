<svg width="900" height="8" viewBox="0 0 900 8"
     xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <linearGradient id="dvline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0"/>
      <stop offset="18%" stop-color="#8A2BE2" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#4169E1" stop-opacity="0.85"/>
      <stop offset="82%" stop-color="#00CED1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00CED1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dvpulse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect y="3.25" width="900" height="1.5" fill="url(#dvline)"/>
  <ellipse cx="-80" cy="4.0" rx="64" ry="4.0" fill="url(#dvpulse)">
    <animate attributeName="cx" values="-80;980" dur="6s" repeatCount="indefinite"/>
  </ellipse>
</svg>
